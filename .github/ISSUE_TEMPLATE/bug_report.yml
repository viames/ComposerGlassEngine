name: Bug report
description: Report reproducible incorrect behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Reproducer
      description: Provide a minimal public manifest or Swift test case.
    validations:
      required: true
  - type: input
    attributes:
      label: ComposerGlass Engine version
    validations:
      required: true
  - type: input
    attributes:
      label: Reference Composer version
  - type: textarea
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
